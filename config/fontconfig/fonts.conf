<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
 <!-- Global config -->
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
  <edit mode="assign" name="embeddedbitmap">
   <bool>false</bool>
  </edit>
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
  <edit mode="assign" name="lcdfilter">
   <const>lcddefault</const>
  </edit>
  <edit mode="assign" name="rgba">
   <const>rgb</const>
  </edit>
  <edit mode="assign" name="embolden">
   <bool>false</bool>
  </edit>
 </match>
 <alias>
  <family>sans-serif</family>
  <prefer>
   <!-- Default -->
   <family>Noto Sans</family>
   <!-- Japanese -->
   <family>Noto Sans CJK JP</family>
   <!-- Korean -->
   <family>Noto Sans CJK KR</family>
   <!-- Chinese -->
   <family>Noto Sans CJK SC</family>
   <family>Noto Sans CJK TC</family>
  </prefer>
 </alias>
 <alias>
  <family>serif</family>
  <prefer>
   <!-- Default -->
   <family>Noto Serif</family>
   <!-- Japanese -->
   <family>IPAexMincho</family>
   <!-- Korean -->
   <family>NanumMyeongjo</family>
   <!-- Chinese -->
   <family>Noto Serif CJK SC</family>
   <family>Noto Serif CJK TC</family>
  </prefer>
 </alias>
 <alias>
  <family>monospace</family>
  <prefer>
   <!-- Default -->
   <family>JetBrains Mono NL</family>
   <!-- Japanese -->
   <family>Sarasa Mono J</family>
   <!-- Korean -->
   <family>Sarasa Mono K</family>
   <!-- Chinese -->
   <family>Sarasa Mono SC</family>
   <family>Sarasa Mono TC</family>
  </prefer>
 </alias>
 <!-- Noto CJK Redirect -->
 <match target="pattern">
  <test compare="eq" name="family" qual="any">
   <string>Noto Sans JP</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>Noto Sans CJK JP</string>
  </edit>
 </match>
 <match target="pattern">
  <test compare="eq" name="family" qual="any">
   <string>Noto Sans KR</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>Noto Sans CJK KR</string>
  </edit>
 </match>
 <match target="pattern">
  <test compare="eq" name="family" qual="any">
   <string>Noto Sans SC</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>Noto Sans CJK SC</string>
  </edit>
 </match>
 <match target="pattern">
  <test compare="eq" name="family" qual="any">
   <string>Noto Sans TC</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>Noto Sans CJK TC</string>
  </edit>
 </match>
 <match target="pattern">
  <test compare="eq" name="family" qual="any">
   <string>Noto Sans HK</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>Noto Sans CJK HK</string>
  </edit>
 </match>
 <dir>~/.local/share/fonts</dir>
 <!-- KDE config -->
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="rgba">
   <const>rgb</const>
  </edit>
 </match>
 <match mode="font">
  <edit mode="assign" name="lcdfilter">
   <const>lcddefault</const>
  </edit>
 </match>
 <match mode="font">
  <edit mode="assign" name="embeddedbitmap">
   <bool>false</bool>
  </edit>
 </match>
 <match mode="font">
  <edit mode="assign" name="embolden">
   <bool>false</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
</fontconfig>
